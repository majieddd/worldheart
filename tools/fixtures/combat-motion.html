<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#10202b;color:white;font:20px system-ui}canvas{display:block}#label{position:absolute;top:12px;left:24px}</style><div id="label">Sword · Twin Fang · Spear - grip and contact review</div><script type="importmap">{"imports":{"three":"/lib/three.module.min.js"}}</script><script type="module">
import * as T from 'three';import {buildSoldier,poseSoldier,freshSoldierState} from '/js/soldier.js';import {ViewModel} from '/js/viewmodel.js';
const r=new T.WebGLRenderer({antialias:true});r.setSize(1440,900);document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#10202b');scene.add(new T.HemisphereLight(0xc4d8ff,0x5f6748,2));let sun=new T.DirectionalLight(0xffffff,3);sun.position.set(3,5,6);scene.add(sun);
const c=new T.PerspectiveCamera(38,1440/900,.01,100);c.position.set(0,3.5,8);c.lookAt(0,.2,0);
const mats=Object.fromEntries(Object.entries({body:0x477f83,trim:0xcad4d8,gold:0xe7c25e,dark:0x273848,energy:0x57ded1,grip:0x614736}).map(([k,color])=>[k,new T.MeshStandardMaterial({color,roughness:.6,metalness:.2,flatShading:true})]));
const actors=['commander','duelist','warden'].map((key,i)=>{const build=buildSoldier(key,mats),group=new T.Group();group.position.x=(i-1)*2.25;group.position.y=-.5;group.rotation.y=.25;scene.add(group);const bindings=[];for(const part of build.parts)for(const a of part.at){const mesh=new T.Mesh(part.geo,part.mat);mesh.matrixAutoUpdate=false;group.add(mesh);bindings.push({mesh,...a});}return{key,build,group,bindings,state:freshSoldierState(),unit:{type:{strike:{kind:'melee'}},phase:0,swingDur:.8,swingSide:1}};});
window.drawPose=(p,side=1)=>{for(const a of actors){a.unit.swingT=p<0?0:(1-p)*.8;a.unit.swingSide=side;poseSoldier(a.build.skeleton,a.build.spec,a.unit,a.state,0);a.build.skeleton.compute(new T.Matrix4());for(const b of a.bindings)b.mesh.matrix.multiplyMatrices(b.joint.world,b.off);}r.render(scene,c);};window.actors=actors;window.render=r;window.cam=c;window.scene=scene;window.vm=new ViewModel();window.ready=true;drawPose(-1);
</script></html>
